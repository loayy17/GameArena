# it check the value for upgrade header and depend on it to set the connection header to upgrade or close like switch case
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}


# redirect to https
server {
    listen 80;
    return 301 https://$host$request_uri;

}

#  the https server
server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /certs/gamearena.crt;
    ssl_certificate_key /certs/gamearena.key;
    client_max_body_size 4m; # this to override the 1mb becasue the max avatar size is 2mb not 1mb

    # frontend
    location / {
        proxy_pass http://frontend:3000;
    }

    # backend
    location /api/ {
        include /tools/backend-proxy.conf;
    }

    location /swagger/ {
        include /tools/backend-proxy.conf;
    }

    location /socialHub {
        include /tools/backend-proxy.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade; # it come from map above
        proxy_read_timeout 86400; # 24 hours
    }

    location /gameHub {
        include /tools/backend-proxy.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400; # 24 hours
    }
}