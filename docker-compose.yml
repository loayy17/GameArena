services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gamearena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamearena}
      POSTGRES_DB: ${POSTGRES_DB:-gamearena}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gamearena} -d ${POSTGRES_DB:-gamearena}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - arena

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-gamearena};Username=${POSTGRES_USER:-gamearena};Password=${POSTGRES_PASSWORD:-gamearena}
      JWT__Token: ${JWT__Token:-CHANGE_ME_to_a_long_random_secret_key_at_least_32_chars}
      JWT__Issuer: ${JWT__Issuer:-GameArena}
      JWT__Audience: ${JWT__Audience:-GameArena}
      EmailSettings__Email: ${EmailSettings__Email:-noreply@localhost}
      EmailSettings__Password: ${EmailSettings__Password:-}
      Cors__AllowedOrigins__0: https://localhost
      Cors__AllowedOrigins__1: https://127.0.0.1
      Cors__AllowedOrigins__2: https://localhost:8443
      Cors__AllowedOrigins__3: https://127.0.0.1:8443
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - arena

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - arena

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8443:443"
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pidof nginx >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arena

volumes:
  postgres_data:

networks:
  arena:
    driver: bridge
